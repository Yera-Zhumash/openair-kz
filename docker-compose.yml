services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: openair
      POSTGRES_PASSWORD: openair
      POSTGRES_DB: openair
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openair"]
      interval: 5s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://openair:openair@db:5432/openair
      # INGEST_TOKEN: change-me   # optional: require X-API-Key on POST
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
